<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Alcor Chain wallet plugins</title>
    <style>
      body { font: 15px/1.5 system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; }
      button, input { font: inherit; padding: 8px 14px; margin: 0 8px 8px 0; }
      input { width: 10em; }
      pre { background: #f3f3f3; padding: 12px; white-space: pre-wrap; word-break: break-all; }
    </style>
  </head>
  <body>
    <h1>Alcor Chain wallet plugins</h1>
    <p>
      Log in on the Alcor Chain testnet with an Ethereum wallet (MetaMask, Rabby, Coinbase Wallet) or a
      Solana wallet (Phantom, Solflare, Backpack). No account yet? Make one with your wallet's key at the
      <a href="https://acc.alcor.exchange/faucet">testnet faucet</a>.
    </p>
    <button id="login">Log in</button>
    <button id="logout" disabled>Log out</button>
    <p>
      <input id="to" value="faucet" aria-label="Recipient" />
      <input id="quantity" value="0.0001 HORN" aria-label="Quantity" />
      <button id="transfer" disabled>Send</button>
    </p>
    <pre id="log">Not logged in</pre>
    <script type="module" src="./dist/main.js"></script>
  </body>
</html>
